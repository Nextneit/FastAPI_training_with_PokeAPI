services:
  api:
    build: ./backend
    container_name: fastapi_pokeapi
    env_file:
      - ./.env
    volumes:
      - ./backend/app:/app
    ports:
      - "8000:80"
    environment:
      - PYTHONPATH=./backend/app
    depends_on:
      - db  # Esto asegura que la DB arranque antes que la API

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: